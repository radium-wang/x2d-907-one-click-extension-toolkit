name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python -B -m unittest discover -s tests
